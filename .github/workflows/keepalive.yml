name: Supabase keep-alive
# Acessa o banco a cada 2 dias para o plano gratuito do Supabase nao pausar o projeto.
on:
  schedule:
    - cron: "17 12 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://xwehsjkhicmzslflqxtp.supabase.co/rest/v1/rpc/list_member_presence" \
            -H "apikey: sb_publishable_JWEJvIBgr3VfMIlcPPGkPw_2OAco4gu" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
