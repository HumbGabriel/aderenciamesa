name: Supabase keep-alive (Stone Blinders)
# Acessa o banco do Stone Blinders a cada 2 dias para o plano gratuito do Supabase nao pausar o projeto.
on:
  schedule:
    - cron: "23 12 */2 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://mxcychbjczkfsbbckpur.supabase.co/rest/v1/rpc/list_member_presence" \
            -H "apikey: sb_publishable_QRIhAHy69ZZE0KET3Xh4Jw_Qru27uXH" \
            -H "Content-Type: application/json" -d '{}' -o /dev/null -w "HTTP %{http_code}\n"
